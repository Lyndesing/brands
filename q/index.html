<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Abriendo…</title>
<style>
  :root{color-scheme:light;--bg:#ffffff;--fg:#141414;--muted:#737373;--line:#e5e5e5}
  @media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101010;--fg:#f2f2f2;--muted:#8f8f8f;--line:#2a2a2a}}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px;box-sizing:border-box}
  main{max-width:360px;text-align:center;display:grid;gap:12px}
  .caps{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  h1{font-weight:300;font-size:22px;letter-spacing:-.02em;margin:0}
  p{margin:0;color:var(--muted)}
  a{color:var(--fg)}
  .bar{height:2px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:var(--fg);animation:slide 1s ease-in-out infinite}
  @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<main>
  <span class="caps" id="eyebrow">Redirigiendo</span>
  <h1 id="title">Abriendo el enlace…</h1>
  <div class="bar" id="bar"><i></i></div>
  <p id="msg"></p>
  <noscript><p>Activa JavaScript para abrir este enlace.</p></noscript>
</main>
<script>
(function () {
  // Rutas soportadas:
  //   /brands/q/<codigo>      (servida por 404.html)
  //   /brands/q/?<codigo>     o  /brands/q/?c=<codigo>
  var path = location.pathname;
  var m = path.match(/^(.*?)\/q(?:\/([^\/?#]+))?\/?$/);
  var base, code = "";
  if (m) {
    base = m[1];
    code = m[2] || "";
  } else {
    base = path.split("/").slice(0, 2).join("/"); // "/brands"
  }
  if (!code && m) {
    var qs = location.search.replace(/^\?/, "");
    var params = new URLSearchParams(qs);
    code = params.get("c") || (qs.indexOf("=") === -1 ? qs : "");
  }
  try { code = decodeURIComponent(code); } catch (e) {}
  code = code.trim().toLowerCase();

  var home = location.origin + base + "/";
  function show(eyebrow, title, html) {
    document.getElementById("bar").hidden = true;
    document.getElementById("eyebrow").textContent = eyebrow;
    document.getElementById("title").textContent = title;
    document.getElementById("msg").innerHTML = html;
    document.title = title;
  }
  function safe(u) { return typeof u === "string" && /^https?:\/\//i.test(u); }

  if (!m) {
    show("Error 404", "Esta página no existe", '<a href="' + home + '">Ir al inicio</a>');
    return;
  }
  if (!code) {
    show("Enlace incompleto", "Falta el código del QR", '<a href="' + home + '">Ir al inicio</a>');
    return;
  }

  // Los destinos viven en la hoja de Google «Vibe · Marketing · Destinos QR» (compartida como "cualquiera con el enlace puede ver").
  // Columnas: codigo, nombre, destino, activo, utm_source, utm_medium, utm_campaign, utm_content, notas
  var SHEET_ID = "1XYmfx1c05KUTahIL5zU15nS9VZQ2c0vn3fyiR-LAE4M";
  var t = Date.now();
  var SOURCES = [
    "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&headers=1&t=" + t,
    "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/export?format=csv&t=" + t
  ];

  function parseCSV(text) {
    var rows = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += ch;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  function key(s) {
    return String(s || "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
  }
  function findRow(rows) {
    var head = (rows[0] || []).map(key);
    var col = function (names) { for (var i = 0; i < names.length; i++) { var j = head.indexOf(names[i]); if (j !== -1) return j; } return -1; };
    var c = { code: col(["codigo", "code"]), dest: col(["destino", "url", "destination"]), active: col(["activo", "active", "estado"]),
      src: col(["utm_source"]), med: col(["utm_medium"]), camp: col(["utm_campaign"]), cont: col(["utm_content"]) };
    if (c.code === -1 || c.dest === -1) throw new Error("columnas");
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      if (key(row[c.code]).replace(/_/g, "-") !== code && String(row[c.code] || "").trim().toLowerCase() !== code) continue;
      var get = function (j) { return j === -1 ? "" : String(row[j] || "").trim(); };
      var activeRaw = key(get(c.active));
      var paused = ["no", "false", "0", "n", "pausado", "pausa", "inactivo", "off"].indexOf(activeRaw) !== -1;
      var url = get(c.dest);
      if (safe(url)) {
        try {
          var u = new URL(url);
          [["utm_source", get(c.src)], ["utm_medium", get(c.med)], ["utm_campaign", get(c.camp)], ["utm_content", get(c.cont)]].forEach(function (p) {
            if (p[1]) u.searchParams.set(p[0], p[1]);
          });
          url = u.toString();
        } catch (e) { url = ""; }
      } else url = "";
      return { url: url, paused: paused };
    }
    return null;
  }
  function load(i) {
    if (i >= SOURCES.length) return Promise.reject(new Error("sin datos"));
    return fetch(SOURCES[i], { cache: "no-store", credentials: "omit" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (txt) { if (/^\s*</.test(txt)) throw new Error("html"); return parseCSV(txt); })
      .catch(function () { return load(i + 1); });
  }

  load(0)
    .then(function (rows) {
      var link = findRow(rows);
      if (link && !link.paused && link.url) {
        location.replace(link.url);
        return;
      }
      var reason = !link ? "No encontramos este código." : (link.paused ? "Esta campaña está pausada por ahora." : "Este código no tiene un destino válido.");
      show("Código " + code.replace(/[<>&"]/g, ""), "Este enlace no está disponible",
        reason + ' <a href="' + home + '">Ir al sitio</a>');
    })
    .catch(function () {
      show("Sin conexión", "No pudimos abrir el enlace", 'Revisa tu conexión y vuelve a escanear el código. <a href="' + home + '">Ir al inicio</a>');
    });
})();
</script>
</body>
</html>
